<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manual Cecilia | Backoffice Fullness Lab</title>
    <style>
      :root {
        --ink: #17110c;
        --cream: #f4eadb;
        --paper: #fff8ef;
        --beet: #8e263c;
        --beet-deep: #300814;
        --plum: #16060c;
        --muted: #8e806f;
        --sage: #70825f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1600px;
        height: 900px;
        overflow: hidden;
        color: var(--cream);
        background: var(--plum);
        font-family: "Avenir Next", "Inter", Arial, sans-serif;
      }

      .slide {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        width: 1600px;
        height: 900px;
        padding: 74px 86px 66px;
        overflow: hidden;
        background:
          radial-gradient(circle at 86% 14%, rgba(142, 38, 60, 0.28), transparent 30%),
          radial-gradient(circle at 10% 90%, rgba(244, 234, 219, 0.09), transparent 28%),
          linear-gradient(135deg, #13060b 0%, #251019 48%, #080706 100%);
      }

      .slide.light {
        color: var(--ink);
        background:
          radial-gradient(circle at 88% 10%, rgba(142, 38, 60, 0.12), transparent 31%),
          radial-gradient(circle at 8% 92%, rgba(112, 130, 95, 0.18), transparent 30%),
          linear-gradient(135deg, #fff8ef 0%, #efe3d1 100%);
      }

      .slide::before {
        content: "";
        position: absolute;
        inset: 38px;
        border: 1px solid rgba(244, 234, 219, 0.16);
        pointer-events: none;
      }

      .slide.light::before {
        border-color: rgba(81, 20, 37, 0.16);
      }

      .brand {
        position: absolute;
        top: 54px;
        right: 72px;
        display: flex;
        align-items: center;
        gap: 18px;
        color: inherit;
      }

      .brand img {
        width: 168px;
        height: auto;
        object-fit: contain;
      }

      .brand span {
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        opacity: 0.7;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #c98699;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .light .eyebrow {
        color: var(--beet);
      }

      h1,
      h2 {
        margin: 0;
        font-family: "Avenir Next", "Inter", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }

      h1 {
        max-width: 920px;
        font-size: 92px;
        line-height: 0.95;
      }

      h2 {
        max-width: 860px;
        font-size: 68px;
        line-height: 0.98;
      }

      .lead {
        max-width: 760px;
        margin: 28px 0 0;
        color: rgba(244, 234, 219, 0.78);
        font-size: 29px;
        line-height: 1.35;
      }

      .light .lead {
        color: rgba(23, 17, 12, 0.68);
      }

      .content {
        position: relative;
        z-index: 2;
        align-self: center;
      }

      .cover-grid {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(420px, 0.65fr);
        gap: 72px;
        align-items: center;
      }

      .cover-card {
        align-self: end;
        padding: 34px;
        border: 1px solid rgba(244, 234, 219, 0.15);
        background: rgba(244, 234, 219, 0.06);
      }

      .cover-card p {
        margin: 0;
        color: rgba(244, 234, 219, 0.76);
        font-size: 25px;
        line-height: 1.35;
      }

      .module-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 22px;
        margin-top: 42px;
      }

      .module-card,
      .step-card,
      .note-card {
        min-height: 190px;
        padding: 28px;
        border: 1px solid rgba(81, 20, 37, 0.14);
        background: rgba(255, 250, 242, 0.74);
      }

      .slide:not(.light) .module-card,
      .slide:not(.light) .step-card,
      .slide:not(.light) .note-card {
        border-color: rgba(244, 234, 219, 0.14);
        background: rgba(244, 234, 219, 0.07);
      }

      .module-card strong,
      .step-card strong,
      .note-card strong {
        display: block;
        margin-bottom: 12px;
        color: var(--beet);
        font-size: 25px;
      }

      .slide:not(.light) .module-card strong,
      .slide:not(.light) .step-card strong,
      .slide:not(.light) .note-card strong {
        color: #e2a5b4;
      }

      .module-card p,
      .step-card p,
      .note-card p {
        margin: 0;
        color: rgba(23, 17, 12, 0.68);
        font-size: 22px;
        line-height: 1.34;
        overflow-wrap: anywhere;
      }

      .slide:not(.light) .module-card p,
      .slide:not(.light) .step-card p,
      .slide:not(.light) .note-card p {
        color: rgba(244, 234, 219, 0.72);
      }

      .two-col {
        display: grid;
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1fr);
        gap: 64px;
        align-items: center;
      }

      .list {
        display: grid;
        gap: 16px;
        margin-top: 34px;
      }

      .list-item {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        font-size: 25px;
        line-height: 1.28;
      }

      .bullet {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        color: var(--cream);
        background: var(--beet);
        font-size: 18px;
        font-weight: 900;
      }

      .visual-panel {
        position: relative;
        min-height: 520px;
        padding: 38px;
        border: 1px solid rgba(244, 234, 219, 0.16);
        background:
          linear-gradient(160deg, rgba(244, 234, 219, 0.1), rgba(244, 234, 219, 0.02)),
          rgba(10, 7, 6, 0.34);
      }

      .light .visual-panel {
        border-color: rgba(81, 20, 37, 0.14);
        background:
          linear-gradient(160deg, rgba(142, 38, 60, 0.08), rgba(255, 255, 255, 0.5)),
          rgba(255, 250, 242, 0.78);
      }

      .mock-panel {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 16px;
        height: 100%;
      }

      .mock-nav {
        display: grid;
        gap: 10px;
        align-content: start;
      }

      .mock-nav span,
      .mock-field,
      .mock-card {
        border: 1px solid rgba(81, 20, 37, 0.12);
        background: rgba(255, 250, 242, 0.8);
      }

      .mock-nav span {
        min-height: 56px;
        padding: 17px 14px;
        color: var(--ink);
        font-weight: 800;
      }

      .mock-nav span:first-child {
        color: var(--cream);
        background: var(--beet);
      }

      .mock-work {
        display: grid;
        grid-template-columns: 210px 1fr;
        gap: 14px;
      }

      .mock-list,
      .mock-form {
        display: grid;
        gap: 12px;
        align-content: start;
        padding: 16px;
        border: 1px solid rgba(81, 20, 37, 0.12);
        background: rgba(255, 248, 239, 0.72);
      }

      .mock-card {
        min-height: 70px;
      }

      .mock-field {
        min-height: 48px;
      }

      .mock-field.large {
        min-height: 112px;
      }

      .timeline {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
        margin-top: 42px;
      }

      .timeline .step-card {
        min-height: 240px;
      }

      .danger {
        color: #ffced8;
      }

      .footer {
        position: absolute;
        left: 86px;
        right: 86px;
        bottom: 42px;
        display: flex;
        justify-content: space-between;
        color: currentColor;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.62;
      }

      .plate {
        position: absolute;
        right: -80px;
        bottom: -160px;
        width: 640px;
        opacity: 0.92;
        filter: drop-shadow(0 32px 54px rgba(0, 0, 0, 0.38));
      }

      .bag {
        position: absolute;
        right: -40px;
        bottom: -60px;
        width: 620px;
        opacity: 0.96;
        filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.22));
      }

      .quote {
        max-width: 940px;
        margin-top: 38px;
        padding-left: 30px;
        border-left: 4px solid var(--beet);
        color: rgba(244, 234, 219, 0.78);
        font-size: 34px;
        line-height: 1.24;
      }

      .light .quote {
        color: rgba(23, 17, 12, 0.72);
      }
    </style>
  </head>
  <body>
    <main id="deck"></main>

    <script>
      const assets = {
        logo: "../../public/assets/brand/fullness-lab-horizontal-marfil-2026.png",
        plate: "../../src/assets/fullness-hero-plate-cutout.png",
        bag: "../../src/assets/fullness-mealprep-band-label-fullness.png"
      };

      const slides = [
        {
          theme: "dark",
          eyebrow: "Manual operativo",
          title: "Operaciones Fullness Lab",
          lead: "Guia visual para descargar listados autorizados y ayudar a las personas a recuperar su acceso.",
          aside: "Pensado para Cecilia: acciones claras, archivos ordenados y proteccion de los datos de clientes.",
          media: "plate"
        },
        {
          theme: "light",
          eyebrow: "Alcance",
          title: "Un modulo para operaciones",
          lead: "La cuenta de Cecilia abre unicamente Operaciones. Asi cada tarea queda clara y el acceso se mantiene acotado.",
          modules: [
            ["Suscritos", "Exportar personas inscritas y su estado."],
            ["Clientes", "Exportar historial consolidado de compra."],
            ["Ventas", "Exportar ordenes, estados y montos."],
            ["Recuperacion", "Enviar enlace seguro de nueva contrasena."]
          ]
        },
        {
          theme: "light",
          eyebrow: "Acceso",
          title: "Entrar al backoffice",
          lead: "La cuenta asignada lleva directamente al modulo Operaciones.",
          list: [
            "Entrar al sitio e iniciar sesion.",
            "Abrir Backoffice desde el menu o visitar /#backoffice.",
            "Si no aparece, cerrar sesion y volver a entrar.",
            "Usar siempre la cuenta asignada para esta tarea."
          ],
          visual: "mock"
        },
        {
          theme: "dark",
          eyebrow: "Exportaciones",
          title: "Descargar el listado correcto",
          lead: "Cada boton prepara un CSV completo, listo para abrir con Excel, Numbers o Google Sheets.",
          list: [
            "Elegir Suscritos, Clientes o Ventas historicas.",
            "Esperar a que termine la descarga.",
            "Abrir el archivo desde Descargas.",
            "Guardar una copia solo en una ubicacion autorizada."
          ]
        },
        {
          theme: "light",
          eyebrow: "Suscritos",
          title: "Contactos de suscripcion",
          lead: "Este archivo sirve para trabajar comunicaciones con las personas que dejaron sus datos en el sitio.",
          modules: [
            ["Nombre", "Identificar a la persona."],
            ["Correo", "Canal principal de contacto."],
            ["Telefono", "Dato entregado al suscribirse."],
            ["Estado", "Fecha de alta y eventual baja."]
          ]
        },
        {
          theme: "dark",
          eyebrow: "Clientes",
          title: "Ver la relacion completa",
          lead: "El archivo de Clientes combina los datos de contacto con su comportamiento de compra.",
          list: [
            "Cantidad de compras por persona.",
            "Total historico en pesos chilenos.",
            "Primera y ultima compra.",
            "Fecha de creacion de cuenta cuando exista."
          ],
          media: "bag"
        },
        {
          theme: "light",
          eyebrow: "Ventas historicas",
          title: "Consultar ventas sin modificar ordenes",
          lead: "El CSV entrega la informacion necesaria para seguimiento y conciliacion, en formato de solo lectura.",
          modules: [
            ["Orden", "Identificador y fecha de compra."],
            ["Estados", "Pedido, pago y despacho."],
            ["Cliente", "Datos para seguimiento."],
            ["Monto", "Total y moneda de la venta."]
          ]
        },
        {
          theme: "dark",
          eyebrow: "Abrir CSV",
          title: "Mantener los datos legibles",
          lead: "Los archivos se exportan en UTF-8 y con separador de coma para conservar tildes, montos y columnas.",
          list: [
            "En Excel elegir UTF-8 si pregunta por el formato.",
            "Mantener el separador coma.",
            "No cambiar ID de ordenes antes de guardar una copia.",
            "No reenviar los archivos fuera de los canales autorizados."
          ]
        },
        {
          theme: "light",
          eyebrow: "Ayuda de acceso",
          title: "Enviar una recuperacion segura",
          lead: "Cecilia no modifica contrasenas: solo solicita el enlace seguro para la persona que lo necesita.",
          modules: [
            ["Confirmar", "Revisar el correo con la persona."],
            ["Escribir", "Ingresarlo en el formulario."],
            ["Enviar", "Solicitar el enlace de recuperacion."],
            ["Avisar", "Pedir revisar inbox y spam."]
          ]
        },
        {
          theme: "dark",
          eyebrow: "Mercado Pago",
          title: "Consultar, no configurar",
          lead: "Cecilia ve los estados de pago dentro de Ventas historicas. La configuracion de cobros permanece protegida.",
          list: [
            "Usar estado de pago para responder consultas.",
            "No editar ordenes, pagos ni webhooks.",
            "No solicitar access tokens ni secretos.",
            "Escalar cualquier problema de cobro al administrador propietario."
          ]
        },
        {
          theme: "light",
          eyebrow: "Cuidado de datos",
          title: "Limites que protegen a clientes y negocio",
          lead: "El acceso esta deliberadamente acotado: no hay panel de base de datos, configuracion de pagos ni edicion de cuentas.",
          modules: [
            ["No contrasenas", "Nunca pedirlas ni recibirlas."],
            ["No credenciales", "Nunca compartir tokens o secretos."],
            ["No edicion", "No alterar pedidos ni pagos."],
            ["Solo CSV", "Compartirlos por canales autorizados."]
          ]
        },
        {
          theme: "dark",
          eyebrow: "Rutina diaria",
          title: "Un flujo breve y ordenado",
          lead: "Trabajar en pasos simples ayuda a mantener los listados actualizados y responder rapido a quienes necesiten apoyo.",
          timeline: [
            ["1", "Entrar al backoffice"],
            ["2", "Descargar el CSV necesario"],
            ["3", "Trabajar en una copia autorizada"],
            ["4", "Enviar recuperacion si corresponde"],
            ["5", "Escalar cualquier excepcion"]
          ],
          quote: "Cuidar los datos tambien es parte de la experiencia Fullness: cada acceso tiene un proposito claro."
        }
      ];

      const params = new URLSearchParams(window.location.search);
      const slideIndex = Math.max(0, Math.min(slides.length - 1, Number(params.get("slide") || 1) - 1));
      const slide = slides[slideIndex];

      function renderList(items) {
        return `<div class="list">${items.map((item, index) => `
          <div class="list-item"><span class="bullet">${index + 1}</span><span>${item}</span></div>
        `).join("")}</div>`;
      }

      function renderModules(items) {
        return `<div class="module-grid">${items.map(([title, body]) => `
          <article class="module-card"><strong>${title}</strong><p>${body}</p></article>
        `).join("")}</div>`;
      }

      function renderTimeline(items) {
        return `<div class="timeline">${items.map(([number, body]) => `
          <article class="step-card"><strong>${number}</strong><p>${body}</p></article>
        `).join("")}</div>`;
      }

      function renderMock() {
        return `
          <div class="visual-panel">
            <div class="mock-panel">
              <nav class="mock-nav">
                <span>Operaciones</span>
              </nav>
              <div class="mock-work">
                <div class="mock-list"><div class="mock-card"></div><div class="mock-card"></div><div class="mock-card"></div></div>
                <div class="mock-form"><div class="mock-field"></div><div class="mock-field"></div><div class="mock-field large"></div><div class="mock-field"></div></div>
              </div>
            </div>
          </div>`;
      }

      const isCover = slide.aside;
      const themeClass = slide.theme === "light" ? "light" : "";
      const mediaHtml = slide.media ? `<img class="${slide.media === "bag" ? "bag" : "plate"}" src="${assets[slide.media]}" alt="" />` : "";
      const bodyHtml = slide.modules
        ? renderModules(slide.modules)
        : slide.timeline
          ? renderTimeline(slide.timeline)
          : slide.list
            ? renderList(slide.list)
            : "";

      document.getElementById("deck").innerHTML = `
        <section class="slide ${themeClass}">
          <div class="brand"><span>Fullness Lab</span><img src="${assets.logo}" alt="" /></div>
          ${isCover ? `
            <div class="content cover-grid">
              <div>
                <p class="eyebrow">${slide.eyebrow}</p>
                <h1>${slide.title}</h1>
                <p class="lead">${slide.lead}</p>
              </div>
              <aside class="cover-card"><p>${slide.aside}</p></aside>
            </div>
          ` : `
            <div class="content ${slide.visual ? "two-col" : ""}">
              <div>
                <p class="eyebrow">${slide.eyebrow}</p>
                <h2>${slide.title}</h2>
                <p class="lead">${slide.lead}</p>
                ${bodyHtml}
                ${slide.quote ? `<p class="quote">${slide.quote}</p>` : ""}
              </div>
              ${slide.visual === "mock" ? renderMock() : ""}
            </div>
          `}
          ${mediaHtml}
          <div class="footer"><span>Manual Cecilia</span><span>${String(slideIndex + 1).padStart(2, "0")} / ${String(slides.length).padStart(2, "0")}</span></div>
        </section>`;
    </script>
  </body>
</html>
